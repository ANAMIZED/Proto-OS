# ProtoOS CustomResourceDefinitions (LMOS-style local registry backend).
# Shapes match protoos/registry.py LocalRegistry records.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentcards.proto.dev
spec:
  group: proto.dev
  scope: Namespaced
  names: {plural: agentcards, singular: agentcard, kind: AgentCard, shortNames: [ac]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [did, name]
              properties:
                did: {type: string}
                name: {type: string}
                description: {type: string}
                skills: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                tools: {type: array, items: {type: string}}
                products: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                endpoints: {type: object, x-kubernetes-preserve-unknown-fields: true}
                protocols: {type: array, items: {type: string}}
                cost: {type: object, x-kubernetes-preserve-unknown-fields: true}
                labels: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policyrules.proto.dev
spec:
  group: proto.dev
  scope: Namespaced
  names: {plural: policyrules, singular: policyrule, kind: PolicyRule, shortNames: [pr]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                layer: {type: string}
                effect: {type: string}
                actions: {type: array, items: {type: string}}
                condition: {type: string}
                description: {type: string}
