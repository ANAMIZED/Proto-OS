# ProtoOS CustomResourceDefinitions (LMOS-style local registry backend).
# Shapes match protoos/registry.py LocalRegistry records.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentcards.proto.dev
spec:
  group: proto.dev
  scope: Namespaced
  names: {plural: agentcards, singular: agentcard, kind: AgentCard, shortNames: [ac]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                did: {type: string}
                name: {type: string}
                description: {type: string}
                capabilities: {type: array, items: {type: string}}
                cost: {type: object}
                endpoints: {type: object}
                @context: {type: array, items: {type: string}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: budgets.proto.dev
spec:
  group: proto.dev
  scope: Namespaced
  names: {plural: budgets, singular: budget, kind: Budget, shortNames: [bdg]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ownerDid: {type: string}
                limit: {type: number}
                window: {type: object}
                categories: {type: array, items: {type: string}}
                parent: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mandates.proto.dev
spec:
  group: proto.dev
  scope: Namespaced
  names: {plural: mandates, singular: mandate, kind: Mandate, shortNames: [mnd]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                type: {type: string, enum: [intent, cart, payment]}
                principal: {type: string}
                amount: {type: number}
                currency: {type: string}
                categories: {type: array, items: {type: string}}
                expires: {type: string}
                signature: {type: string}
                parent: {type: string}
