name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract exact proto-os-v0.2.0 sources (byte-for-byte from ZIP)
        run: |
          unzip -o proto-os-v0.2.0.zip
          # overlay exact modules + tests + verification data from the authoritative ZIP
          cp -a proto-os-v0.2.0/protoos/*.py protoos/
          cp -a proto-os-v0.2.0/tests/*.py tests/
          cp -a proto-os-v0.2.0/demo.py .
          cp -a proto-os-v0.2.0/traceability.json .
          cp -a proto-os-v0.2.0/tools/gen_verification.py tools/ || true
          echo "Extracted exact sources:"
          ls -l protoos/*.py tests/*.py | awk '{print $5, $9}'
          echo "traceability.json size: $(wc -c < traceability.json)"
          python3 -c "import json; d=json.load(open('traceability.json')); r=d['requirements'][0]; print('key present:', 'req' in r, 'requirement' in r)"

      - name: Install package + optional crypto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[crypto,dev]" || pip install "cryptography>=42.0.0" || true

      - name: Unit tests (95)
        run: |
          export PYTHONPATH=$PWD
          python3 -m unittest discover -s tests -v

      - name: Full verification (traceability + live smoke + constellation + vault)
        run: |
          export PYTHONPATH=$PWD
          python3 -m protoos.verify

      - name: CLI surfaces
        run: |
          export PYTHONPATH=$PWD
          python3 -m protoos.cli status || true
          python3 -m protoos.cli graph /tmp/protoos-ci-graph || true
          python3 -m protoos.cli vault /tmp/protoos-ci-vault.zip || true
