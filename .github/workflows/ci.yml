name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional crypto (Ed25519)
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=42.0.0" || true

      - name: Unit tests
        run: |
          export PYTHONPATH=$PWD
          python3 -m unittest discover -s tests -v

      - name: Full verification (traceability + live smoke)
        run: |
          export PYTHONPATH=$PWD
          python3 -m protoos.verify
